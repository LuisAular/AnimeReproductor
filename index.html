<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090b10">
    <title>Anime Player</title>
    <!-- Blindaje CSP: solo permite incrustar reproductores de mp4upload -->
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.mp4upload.com https://mp4upload.com;">
    <style>
        :root {
            --bg-dark: #090b10;
            --card-bg: rgba(18, 22, 32, 0.78);
            --cyan: #00E5FF;
            --purple: #7B2CBF;
            --neon-green: #00FF9D;
            --warning: #FFB800;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 229, 255, 0.08), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(123, 44, 191, 0.12), transparent 45%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 16px;
            overflow-x: hidden;
        }

        /* Cabecera minimalista */
        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .brand {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .shield-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(0, 255, 157, 0.1);
            border: 1px solid rgba(0, 255, 157, 0.4);
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .shield-badge.compat-mode {
            background: rgba(255, 184, 0, 0.12);
            border-color: rgba(255, 184, 0, 0.5);
            color: var(--warning);
        }

        /* Contenedor del reproductor */
        .player-wrapper {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid rgba(0, 229, 255, 0.45);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), 0 0 15px rgba(123, 44, 191, 0.25);
            position: relative;
            display: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* Indicador de carga (Spinner) */
        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 11, 16, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 10;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--cyan);
            border-right-color: var(--purple);
            animation: spin 0.85s linear infinite;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .loader-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Barra inferior de controles */
        .controls-bar {
            width: 100%;
            max-width: 1100px;
            margin-top: 14px;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            color: var(--text-main);
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-compat {
            border-color: rgba(123, 44, 191, 0.6);
            color: #e2c6ff;
        }

        .btn-compat:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
        }

        .btn-reload:hover {
            border-color: var(--cyan);
        }

        /* Caja de respaldo (sin parámetro ?video=) */
        .fallback-box {
            display: none;
            flex-direction: column;
            gap: 14px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(123, 44, 191, 0.5);
            padding: 28px 22px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .fallback-box h2 {
            color: var(--cyan);
            font-size: 1.35rem;
        }

        .fallback-box p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.25);
        }

        .btn-primary {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            display: none;
        }

        /* Optimización móvil: vista vertical */
        @media (max-width: 640px) {
            body { padding: 12px; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .btn { width: 100%; text-align: center; padding: 12px; }
            .input-group { flex-direction: column; }
        }

        /* Optimización móvil: vista horizontal (Modo Cine automático) */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 0;
                background: #000;
            }
            .header, .controls-bar {
                display: none !important;
            }
            .player-wrapper {
                width: 100vw;
                height: 100dvh;
                max-width: none;
                aspect-ratio: auto;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <header id="header" class="header" style="display: none;">
        <div class="brand">Anime Player</div>
        <div id="shield-badge" class="shield-badge">🛡️ Blindaje Activo</div>
    </header>

    <main id="player-container" class="player-wrapper">
        <div id="loader" class="loader-overlay">
            <div class="spinner"></div>
            <span class="loader-text">Preparando reproductor blindado...</span>
        </div>
    </main>

    <div id="controls-bar" class="controls-bar">
        <button class="btn btn-reload" onclick="recargarVideo()">↻ Recargar video</button>
        <button id="btn-compat" class="btn btn-compat" onclick="activarCompatibilidad()">
            ¿No inicia? Activar Modo Compatibilidad
        </button>
    </div>

    <section id="fallback" class="fallback-box">
        <h2>Anime Player</h2>
        <p>Pega un enlace embed de mp4upload para reproducirlo sin ventanas emergentes.</p>
        <div class="input-group">
            <input type="url" id="manual-url" placeholder="https://www.mp4upload.com/embed-...">
            <button class="btn-primary" onclick="cargarManual()">Ver</button>
        </div>
        <span id="error-msg" class="error-msg">Enlace no válido. Debe ser un embed de mp4upload.</span>
    </section>

    <script>
        let loaderTimeout;

        function mostrarLoader(texto = "Preparando reproductor blindado...") {
            const loader = document.getElementById('loader');
            loader.querySelector('.loader-text').textContent = texto;
            loader.classList.remove('hidden');

            // Seguro de 6 segundos por si un script externo bloqueado retrasa el evento onload
            clearTimeout(loaderTimeout);
            loaderTimeout = setTimeout(ocultarLoader, 6000);
        }

        function ocultarLoader() {
            clearTimeout(loaderTimeout);
            document.getElementById('loader').classList.add('hidden');
        }

        function iniciarReproductor() {
            const params = new URLSearchParams(window.location.search);
            const videoUrl = params.get('video');

            if (!videoUrl) {
                document.getElementById('fallback').style.display = 'flex';
                return;
            }

            try {
                const urlObj = new URL(videoUrl);
                if (!urlObj.hostname.includes('mp4upload.com')) {
                    mostrarError();
                    return;
                }
            } catch (e) {
                mostrarError();
                return;
            }

            const container = document.getElementById('player-container');
            const iframe = document.createElement('iframe');

            iframe.id = 'video-frame';
            iframe.src = videoUrl;
            iframe.allowFullscreen = true;

            // Permisos de reproducción + Blindaje ajustado contra pop-ups y redirecciones
            iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-forms');
            iframe.setAttribute('referrerpolicy', 'origin');
            iframe.setAttribute('scrolling', 'no');

            iframe.onload = ocultarLoader;

            mostrarLoader();
            container.appendChild(iframe);

            document.getElementById('header').style.display = 'flex';
            container.style.display = 'block';
            document.getElementById('controls-bar').style.display = 'flex';
        }

        function activarCompatibilidad() {
            const iframe = document.getElementById('video-frame');
            const badge = document.getElementById('shield-badge');
            const btnCompat = document.getElementById('btn-compat');

            if (iframe) {
                mostrarLoader("Cambiando a Modo Compatibilidad...");
                iframe.removeAttribute('sandbox');
                iframe.src = iframe.src;

                badge.textContent = "⚠️ Modo Compatibilidad";
                badge.classList.add('compat-mode');
                btnCompat.style.display = 'none';
            }
        }

        function recargarVideo() {
            const iframe = document.getElementById('video-frame');
            if (iframe) {
                mostrarLoader("Recargando stream...");
                iframe.src = iframe.src;
            }
        }

        function mostrarError() {
            document.getElementById('fallback').style.display = 'flex';
            document.getElementById('error-msg').style.display = 'block';
        }

        function cargarManual() {
            const url = document.getElementById('manual-url').value.trim();
            if (url) {
                window.location.href = `?video=${encodeURIComponent(url)}`;
            }
        }

        iniciarReproductor();
    </script>

</body>
</html>
