<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Player</title>
    <!-- Restringe que tu reproductor solo cargue iframes de mp4upload -->
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.mp4upload.com https://mp4upload.com;">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090b10;
            color: #e6edf3;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .player-wrapper {
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #00E5FF;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.2), 0 0 10px rgba(123, 44, 191, 0.3);
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .fallback-box {
            display: none;
            flex-direction: column;
            gap: 12px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(20, 25, 35, 0.8);
            border: 1px solid #7B2CBF;
            padding: 24px;
            border-radius: 12px;
        }
        .fallback-box h2 { color: #00E5FF; font-size: 1.3rem; }
        .fallback-box p { font-size: 0.9rem; color: #8b949e; }
        .input-group { display: flex; gap: 8px; }
        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            outline: none;
        }
        input:focus { border-color: #00E5FF; }
        button {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #00E5FF, #7B2CBF);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .error-msg { color: #ff4d4d; font-size: 0.85rem; display: none; }
    </style>
</head>
<body>

    <div id="player-container" class="player-wrapper" style="display: none;"></div>

    <!-- Interfaz de respaldo si alguien entra sin el parámetro ?video= -->
    <div id="fallback" class="fallback-box">
        <h2>Anime Player</h2>
        <p>Pega un enlace embed de mp4upload para reproducirlo sin ventanas emergentes.</p>
        <div class="input-group">
            <input type="url" id="manual-url" placeholder="https://www.mp4upload.com/embed-...">
            <button onclick="cargarManual()">Ver</button>
        </div>
        <span id="error-msg" class="error-msg">Enlace no válido. Debe ser un embed de mp4upload.</span>
    </div>

    <script>
        function iniciarReproductor() {
            const params = new URLSearchParams(window.location.search);
            const videoUrl = params.get('video');

            if (!videoUrl) {
                document.getElementById('fallback').style.display = 'flex';
                return;
            }

            // Validación básica para evitar inyecciones de sitios externos
            try {
                const urlObj = new URL(videoUrl);
                if (!urlObj.hostname.includes('mp4upload.com')) {
                    mostrarError();
                    return;
                }
            } catch (e) {
                mostrarError();
                return;
            }

            const container = document.getElementById('player-container');
            const iframe = document.createElement('iframe');

            iframe.src = videoUrl;
            iframe.allowFullscreen = true;
            
            // Refuerzo contra publicidad y rastreo
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.setAttribute('scrolling', 'no');

            container.appendChild(iframe);
            container.style.display = 'block';
        }

        function mostrarError() {
            document.getElementById('fallback').style.display = 'flex';
            document.getElementById('error-msg').style.display = 'block';
        }

        function cargarManual() {
            const url = document.getElementById('manual-url').value.trim();
            if (url) {
                window.location.href = `?video=${encodeURIComponent(url)}`;
            }
        }

        iniciarReproductor();
    </script>

</body>
</html>
